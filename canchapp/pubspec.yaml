name: canchapp
description: Aplicación Flutter para reserva de canchas deportivas

# Prevenir publicación accidental en pub.dev
publish_to: 'none'

# La siguiente línea es la versión de la aplicación
version: 1.0.0+1

environment:
  sdk: '^3.5.0'        # Dart mínimo 3.5 para compatibilidad
  flutter: ">=3.24.0"  # Flutter mínimo 3.24 para resolver errores

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0  # o la versión que uses
  material_design_icons_flutter: ^7.0.0  # o la versión que uses
  # ✅ PLUGINS CON VERSIONES COMPATIBLES (sin errores v1 embedding)
  file_picker: ^8.1.2                     # Selector de archivos actualizado
  image_picker: ^1.1.2                    # Selector de imágenes actualizado
  http: ^1.2.2                            # Cliente HTTP estable
  flutter_plugin_android_lifecycle: ^2.0.28  # 🔑 CRÍTICO: resuelve errores de compilación
  
  # ICONOS Y UI
  cupertino_icons: ^1.0.8                 # Iconos de iOS estándar
  
  # ALMACENAMIENTO Y ARCHIVOS
  shared_preferences: ^2.3.2              # Preferencias locales
  path_provider: ^2.1.4                   # Rutas del sistema
  
  # PERMISOS (si los necesitas)
  permission_handler: ^11.3.1             # Manejo de permisos
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  go_router: ^16.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Reglas de lint actualizadas
  flutter_lints: ^5.0.0

# ⚠️ DEPENDENCIAS FORZADAS (usar solo si hay conflictos)
dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.28
  web: ^1.1.0

# La siguiente sección es específica de Flutter
flutter:
  # Esta línea asegura que Material Design esté disponible
  uses-material-design: true

  # Para agregar assets a tu aplicación, agrega una sección assets
  # assets:
  #   - images/
  #   - assets/icons/

  # Fuentes personalizadas
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic